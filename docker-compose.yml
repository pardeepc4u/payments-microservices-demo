version: '3.8'

services:
  # ===========================================
  # Kafka + Zookeeper
  # ===========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: payments-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: payments-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ===========================================
  # PostgreSQL Databases
  # ===========================================
  payment-db:
    image: postgres:15-alpine
    container_name: payments-payment-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
      - ./payment-service/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - payments-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  account-db:
    image: postgres:15-alpine
    container_name: payments-account-db
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
    ports:
      - "5433:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data
    networks:
      - payments-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15-alpine
    container_name: payments-notification-db
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5434:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - payments-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  audit-db:
    image: postgres:15-alpine
    container_name: payments-audit-db
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    ports:
      - "5435:5432"
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    networks:
      - payments-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 5s
      timeout: 5s
      retries: 5

  settlement-db:
    image: postgres:15-alpine
    container_name: payments-settlement-db
    environment:
      POSTGRES_DB: settlement
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
    ports:
      - "5436:5432"
    volumes:
      - settlement-db-data:/var/lib/postgresql/data
    networks:
      - payments-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: payments-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================
  # Microservices
  # ===========================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payments-payment-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_NAME: payments
      DB_USER: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: payments-account-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: account-db
      DB_PORT: 5432
      DB_NAME: accounts
      DB_USER: accounts
      DB_PASSWORD: accounts
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      account-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: payments-notification-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: notifications
      DB_USER: notifications
      DB_PASSWORD: notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    container_name: payments-audit-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: audit-db
      DB_PORT: 5432
      DB_NAME: audit
      DB_USER: audit
      DB_PASSWORD: audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      audit-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  settlement-service:
    build:
      context: ./settlement-service
      dockerfile: Dockerfile
    container_name: payments-settlement-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: settlement-db
      DB_PORT: 5432
      DB_NAME: settlement
      DB_USER: settlement
      DB_PASSWORD: settlement
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      settlement-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================
  # Monitoring & UI
  # ===========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: payments-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - payments-network

  # ===========================================
  # API Gateway (Optional - for demo)
  # ===========================================
  api-gateway:
    image: nginx:alpine
    container_name: payments-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - payment-service
      - account-service
      - notification-service
      - audit-service
      - settlement-service
    networks:
      - payments-network

networks:
  payments-network:
    driver: bridge

volumes:
  payment-db-data:
  account-db-data:
  notification-db-data:
  audit-db-data:
  settlement-db-data:
  redis-data:
